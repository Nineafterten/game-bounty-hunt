async function runAutofillSearch() {
  const q = $('afQuery').value.trim();
  const statusEl = $('afStatus');
  const resultsEl = $('afResults');
  resultsEl.innerHTML = '';
  if (!store.device.rawgKey) {
    statusEl.className = 'af-status err';
    statusEl.innerHTML = 'No RAWG key set. Add a free key in Manage → Settings to enable auto-fill.';
    return;
  }
  if (!q) return;
  statusEl.className = 'af-status'; statusEl.textContent = 'Searching…';
  try {
    const results = await rawgSearch(q);
    if (!results.length) { statusEl.textContent = 'No matches found.'; return; }
    statusEl.textContent = 'Pick a match to fill the form:';
    resultsEl.innerHTML = results.slice(0, 12).map((r, i) => {
      const yr = r.released ? r.released.slice(0, 4) : '';
      const plat = (r.platforms || []).map(p => p.platform.name)[0] || '';
      return `<div class="af-result" data-i="${i}"><span class="af-name">${escapeHtml(r.name)}</span><span class="af-meta">${escapeHtml([yr, plat].filter(Boolean).join(' · '))}</span></div>`;
    }).join('');
    APP.afResults = results;
    resultsEl.querySelectorAll('.af-result').forEach(el => el.addEventListener('click', () => applyAutofill(results[parseInt(el.dataset.i, 10)])));
  } catch (e) {
    statusEl.className = 'af-status err';
    statusEl.textContent = e && e.message ? e.message : 'RAWG lookup failed.';
  }
}

async function applyAutofill(result) {
  const statusEl = $('afStatus');
  statusEl.className = 'af-status'; statusEl.textContent = 'Loading details…';
  try {
    const detail = await rawgDetail(result.id);
    const f = toPublicFields(detail);
    if (f.title) { $('gTitle').value = f.title; $('afQuery').value = f.title; }
    if (f.year) $('gYear').value = f.year;
    if (f.developer) $('gDeveloper').value = f.developer;
    if (f.platform) $('gSystem').value = f.platform;
    if (f.rating != null) $('gRating').value = f.rating;
    if (f.description) $('gDescription').value = f.description;
    if (f.coverImageUrl) $('gCoverArt').value = f.coverImageUrl;
    if (!$('gGlyph').value.trim()) $('gGlyph').value = autoGlyph(f.title || $('gTitle').value);
    statusEl.textContent = 'Resolving reference link…';
    const wiki = await resolveWikipediaUrl(f.title || result.name);
    if (wiki) $('gGuide').value = wiki;
    statusEl.textContent = 'Filled in! Tweak anything you like, then Save.';
  } catch (e) {
    statusEl.className = 'af-status err';
    statusEl.textContent = e && e.message ? e.message : 'Could not load details.';
  }
}

/* ─── RAWG + Wikipedia (ported from gamer-career) ────────────────────────── */
const RAWG_BASE = 'https://api.rawg.io/api';
const PLATFORM_ALIASES = { 'Nintendo Switch': 'Nintendo Switch', 'PC': 'PC', 'PlayStation 5': 'PlayStation 5', 'PlayStation 4': 'PlayStation 4', 'Xbox Series S/X': 'Xbox Series X/S', 'Game Boy Advance': 'Game Boy Advance', 'Nintendo GameCube': 'GameCube', 'SNES': 'SNES', 'Genesis': 'Genesis', 'Game Boy': 'Game Boy' };
function normalizePlatform(n) { return PLATFORM_ALIASES[n] || n; }
async function rawgRequest(path) {
  const key = store.device.rawgKey;
  if (!key || !key.trim()) throw new Error('No RAWG API key set.');
  const sep = path.includes('?') ? '&' : '?';
  const res = await fetch(`${RAWG_BASE}${path}${sep}key=${encodeURIComponent(key)}`);
  if (res.status === 401) throw new Error('RAWG rejected the API key. Check it in Settings.');
  if (!res.ok) throw new Error(`RAWG request failed (${res.status}).`);
  return res.json();
}
async function rawgSearch(query) {
  const data = await rawgRequest(`/games?search=${encodeURIComponent(query.trim())}&page_size=20`);
  return data.results || [];
}
async function rawgDetail(id) { return rawgRequest(`/games/${id}`); }
function toPublicFields(detail) {
  let desc = detail.description_raw || '';
  if (desc) { desc = desc.split('\n').map(x => x.trim()).filter(Boolean)[0] || desc; if (desc.length > 600) desc = desc.slice(0, 597).trim() + '…'; }
  const rating = typeof detail.metacritic === 'number' ? Math.round(detail.metacritic / 10) : null;
  return {
    title: detail.name,
    developer: (detail.developers || detail.publishers || []).map(p => p.name).join(', ') || '',
    year: detail.released ? parseInt(detail.released.slice(0, 4), 10) : null,
    platform: (detail.platforms || []).map(p => normalizePlatform(p.platform.name))[0] || '',
    rating: rating,
    description: desc,
    coverImageUrl: detail.background_image || '',
  };
}
function wikipediaSearchUrl(title) { return `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(title)}`; }
async function resolveWikipediaUrl(title) {
  const q = (title || '').trim();
  if (!q) return wikipediaSearchUrl(title);
  try {
    const res = await fetch('https://en.wikipedia.org/w/api.php?action=opensearch&format=json&namespace=0&limit=1&origin=*&search=' + encodeURIComponent(q));
    if (res.ok) { const data = await res.json(); const urls = Array.isArray(data) ? data[3] : null; const link = Array.isArray(urls) ? urls[0] : null; if (link) return link; }
  } catch (e) { /* fall through */ }
  return wikipediaSearchUrl(q);
}

function downloadFile(name, text, type) {
  const blob = new Blob([text], { type: type || 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function timestampSlug() {
  const d = new Date(); const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function buildBackup() {
  return { app: APP_ID, version: 2, exportedAt: nowISO(), activeSeasonId: store.activeSeasonId, seasons: store.seasons };
}
function exportBackup() { downloadFile(`bounty-hunt-backup-${timestampSlug()}.json`, JSON.stringify(buildBackup(), null, 2)); }
function exportSeasonJson() {
  const s = activeSeason();
  downloadFile(`bounty-hunt-${(s.season || 'season').toLowerCase()}-${s.year}.json`, JSON.stringify({ app: APP_ID, version: 2, exportedAt: nowISO(), season: s }, null, 2));
}
function csvCell(v) { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportSeasonCsv() {
  const s = activeSeason();
  const cols = ['title', 'reward', 'system', 'players', 'playersNote', 'objectives', 'year', 'developer', 'rating', 'status', 'guide'];
  const rows = [cols.join(',')];
  s.games.forEach(g => {
    rows.push([g.title, bountyOf(g), g.system, g.players, g.playersNote, (g.objectives || []).join('; '), g.year, g.developer, g.rating, g.status, g.guide].map(csvCell).join(','));
  });
  downloadFile(`bounty-hunt-${(s.season || 'season').toLowerCase()}-${s.year}.csv`, rows.join('\n'), 'text/csv');
}

/* CSV parsing (ported) */
function parseCsv(text) {
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; } else field += c; }
    else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
const CSV_ALIASES = {
  title: ['title', 'name', 'game'], reward: ['reward', 'bounty', 'amount', 'prize'],
  system: ['system', 'console', 'platform', 'format'], players: ['players', 'player'],
  playersNote: ['playersnote', 'players note', 'note'], objectives: ['objectives', 'criteria', 'requirements', 'goals'],
  year: ['year', 'released'], developer: ['developer', 'dev', 'studio'], rating: ['rating', 'score'],
  status: ['status', 'outcome'], guide: ['guide', 'walkthrough', 'link', 'url'],
};
function csvCol(header, key) { for (const a of CSV_ALIASES[key]) { const i = header.indexOf(a); if (i >= 0) return i; } return -1; }
function canonTitle(t) {
  const NUM = { one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9', ten: '10' };
  const ROM = { ii: '2', iii: '3', iv: '4', vi: '6', vii: '7', viii: '8', ix: '9' };
  return String(t).toLowerCase().replace(/\([^)]*\)/g, ' ').replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean).map(w => NUM[w] || ROM[w] || w).join(' ').trim();
}
function statusFromLabel(v) {
  const s = String(v || '').trim().toLowerCase();
  if (['complete', 'completed', 'captured', 'won', 'beaten', 'done'].includes(s)) return 'complete';
  if (['withdrawn', 'withdraw', 'skip', 'skipped', 'later'].includes(s)) return 'withdrawn';
  if (['rejected', 'reject', 'given up', 'gave up', 'quit'].includes(s)) return 'rejected';
  return 'open';
}
function parseGamesCsv(text) {
  const grid = parseCsv(text);
  if (!grid.length) return [];
  const first = grid[0].map(c => c.trim().toLowerCase());
  const hasHeader = CSV_ALIASES.title.some(a => first.includes(a));
  const cols = hasHeader ? {} : { title: 0, reward: 1, system: 2 };
  if (hasHeader) Object.keys(CSV_ALIASES).forEach(k => cols[k] = csvCol(first, k));
  const dataRows = hasHeader ? grid.slice(1) : grid;
  const out = [];
  dataRows.forEach(cells => {
    const get = i => (i != null && i >= 0 ? (cells[i] || '').trim() : '');
    const title = get(cols.title);
    if (!title) return;
    out.push(newGame({
      title,
      reward: get(cols.reward) ? Number(get(cols.reward).replace(/[^0-9.]/g, '')) : null,
      system: get(cols.system), players: parseInt(get(cols.players), 10) || 1, playersNote: get(cols.playersNote),
      objectives: get(cols.objectives) ? get(cols.objectives).split(/[;|]/).map(x => x.trim()).filter(Boolean) : [],
      year: get(cols.year) ? parseInt(get(cols.year), 10) : null,
      developer: get(cols.developer), rating: get(cols.rating) ? parseInt(get(cols.rating), 10) : null,
      status: statusFromLabel(get(cols.status)), guide: get(cols.guide),
      cover: { glyph: '', gradient: '' },
    }));
  });
  return out;
}

  openModal(`

    <div class="modal-row"><div class="label-text"><span class="label-main">Full backup (JSON)</span><span class="label-sub">All seasons + history</span></div><button class="btn" id="expBackup">Download</button></div>

    <div class="field" style="margin-top:18px"><label>Import a file (.json backup or .csv of games)</label><input id="impFile" type="file" accept=".json,.csv,application/json,text/csv"></div>
    <div class="field"><label>How to apply</label>
      <select id="impMode">
        <option value="merge">Merge (add new, keep existing)</option>
        <option value="replace">Replace (overwrite)</option>
      </select>

    </div>
    <div class="af-status" id="impStatus"></div>

  $('expBackup').addEventListener('click', exportBackup);

async function doImport() {
  const fileInput = $('impFile');
  const statusEl = $('impStatus');
  const mode = $('impMode').value;
  const file = fileInput.files[0];
  if (!file) { statusEl.className = 'af-status err'; statusEl.textContent = 'Choose a file first.'; return; }
  const text = await file.text();
  const isJson = file.name.toLowerCase().endsWith('.json') || text.trim().startsWith('{') || text.trim().startsWith('[');
  try {
    if (isJson) {
      const data = JSON.parse(text);
      if (data.seasons) {
        if (mode === 'replace') { store.seasons = data.seasons; store.activeSeasonId = data.activeSeasonId && data.seasons[data.activeSeasonId] ? data.activeSeasonId : Object.keys(data.seasons)[0]; }
        else { Object.values(data.seasons).forEach(s => { store.seasons[s.id] = s; }); }
      } else if (data.season) {
        const s = data.season; store.seasons[s.id] = s; if (mode === 'replace') store.activeSeasonId = s.id;
      } else { throw new Error('Not a recognizable backup file.'); }
      saveStore(); closeModal(); render();
      return;
    }
    // CSV → games into active season
    const games = parseGamesCsv(text);
    if (!games.length) { statusEl.className = 'af-status err'; statusEl.textContent = 'No game rows found in that CSV.'; return; }
    const s = activeSeason();
    if (mode === 'replace') { s.games = games; }
    else {
      const seen = new Set(s.games.map(g => canonTitle(g.title)));
      games.forEach(g => { const k = canonTitle(g.title); if (!seen.has(k)) { seen.add(k); s.games.push(g); } });
    }
    if (s.games.length > GAME_CAP) s.games = s.games.slice(0, GAME_CAP);
    saveStore(); closeModal(); renderDashboard(); renderBoard();
  } catch (e) {
    statusEl.className = 'af-status err';
    statusEl.textContent = e && e.message ? e.message : 'Import failed.';
  }
}

      <span class="bd-pill withdrawn"><span class="dotc"></span><b>${counts.withdrawn}</b> withdrawn</span>
      <span class="bd-pill rejected"><span class="dotc"></span><b>${counts.rejected}</b> given up</span>
      <span class="bd-pill open"><span class="dotc"></span><b>${counts.open}</b> still open</span>
    </div>
    <div class="field-grid">
      <div class="field"><label>New season</label><input id="csSeason" value="${attrSafe(s.season)}"></div>
      <div class="field"><label>New year</label><input id="csYear" type="number" value="${(parseInt(s.year, 10) || new Date().getFullYear()) + 1}"></div>
    </div>
    <div class="modal-row"><div class="label-text"><span class="label-main">Carry withdrawn games forward</span><span class="label-sub">Bring the ${counts.withdrawn} withdrawn game(s) to the new board as open</span></div><label class="toggle-pill"><input type="checkbox" id="csCarry" checked style="margin:6px"></label></div>
    <div class="modal-actions">
      <button class="btn" data-close>Cancel</button>
      <button class="btn btn-primary" id="csGo">Close out & start new</button>
    </div>`);
  modalPanel.querySelector('[data-close]').addEventListener('click', closeModal);
  $('csGo').addEventListener('click', () => {
    const old = activeSeason();
    old.closedAt = nowISO();
    const carry = $('csCarry').checked;
    const next = makeSeason({
      title: old.title, eyebrow: old.eyebrow, kidName: old.kidName, defaultBounty: old.defaultBounty,
      season: $('csSeason').value.trim(), year: parseInt($('csYear').value, 10) || (new Date().getFullYear()),
    });
    if (carry) {
      next.games = old.games.filter(g => g.status === 'withdrawn').map(g => newGame(Object.assign({}, g, {
        id: uid('g-'), status: 'open', statusAt: null, hinted: false,
      })));
    }
    store.seasons[next.id] = next;
    store.activeSeasonId = next.id;
    saveStore(); closeModal(); setView('board'); render();
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   MANAGE SETTINGS
   ═══════════════════════════════════════════════════════════════════════════ */
function openSettingsModal() {
  const d = store.device;
  openModal(`
    <h2>Manage settings</h2>
    <p class="sub">Device-level settings (kept on this device, never exported).</p>
    <div class="modal-row">
      <div class="label-text"><span class="label-main">Theme</span><span class="label-sub">Light, dark, or system</span></div>
      <div class="toggle-pill" role="group" aria-label="Theme">
        <button data-theme-set="light" class="${d.themeMode === 'light' ? 'active' : ''}">Light</button>
        <button data-theme-set="dark" class="${d.themeMode === 'dark' ? 'active' : ''}">Dark</button>
        <button data-theme-set="auto" class="${d.themeMode === 'auto' ? 'active' : ''}">Auto</button>
      </div>
    </div>
    <div class="field" style="margin-top:14px"><label>RAWG API key (for auto-fill)</label><input id="setRawg" type="password" value="${attrSafe(d.rawgKey)}" placeholder="Free key from rawg.io/apidocs"><div class="hint">Stored on this device only. Enables the “Auto-fill from RAWG” search in the game editor.</div></div>
    <div class="field"><label>Change Manage PIN</label><input id="setPin" type="password" inputmode="numeric" maxlength="8" placeholder="Leave blank to keep current"></div>
    <div class="modal-row"><div class="label-text"><span class="label-main">Reset all outcomes</span><span class="label-sub">Set every game back to “On the board”</span></div><button class="btn btn-danger" id="resetStatuses">Reset</button></div>
    <div class="modal-row"><div class="label-text"><span class="label-main">Clear hint pins</span><span class="label-sub">Remove “got a hint” markers</span></div><button class="btn btn-danger" id="resetHints">Clear</button></div>
    <div class="modal-actions">
      <button class="btn btn-primary" data-close>Done</button>
    </div>`);
  modalPanel.querySelector('[data-close]').addEventListener('click', () => {
    const pin = $('setPin').value.trim();
    if (pin) { if (pin.length < 3) { alert('PIN must be at least 3 characters.'); return; } store.device.managePin = pin; }
    store.device.rawgKey = $('setRawg').value.trim();
    saveStore(); closeModal();
  });
  modalPanel.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => {
    store.device.themeMode = b.dataset.themeSet; saveStore(); applyTheme();
    modalPanel.querySelectorAll('[data-theme-set]').forEach(x => x.classList.toggle('active', x === b));
  }));
  setupConfirmButton($('resetStatuses'), () => { activeSeason().games.forEach(g => { g.status = 'open'; g.statusAt = null; }); saveStore(); renderDashboard(); renderBoard(); });
  setupConfirmButton($('resetHints'), () => { activeSeason().games.forEach(g => g.hinted = false); saveStore(); renderBoard(); });
}

/* ═══════════════════════════════════════════════════════════════════════════
   WIRING
   ═══════════════════════════════════════════════════════════════════════════ */
$('themeBtn').addEventListener('click', () => {
  const order = ['light', 'dark', 'auto'];
  store.device.themeMode = order[(order.indexOf(store.device.themeMode) + 1) % order.length];
  saveStore(); applyTheme();
});
$('lockBtn').addEventListener('click', () => { if (APP.mode === 'manage') setMode('user'); else openPinModal(); });
$('navBoard').addEventListener('click', () => setView('board'));
$('navHistory').addEventListener('click', () => setView('history'));
$('sortSelect').addEventListener('change', (e) => {
  store.device.sort.field = e.target.value;
  store.device.sort.dir = ['reward', 'rating', 'year', 'status'].includes(e.target.value) ? 'desc' : 'asc';
  saveStore(); updateControls(); renderBoard();
});
$('dirBtn').addEventListener('click', () => { store.device.sort.dir = store.device.sort.dir === 'asc' ? 'desc' : 'asc'; saveStore(); updateControls(); renderBoard(); });
$('layoutCard').addEventListener('click', () => { store.device.layout = 'card'; saveStore(); updateControls(); renderBoard(); });
$('layoutCompact').addEventListener('click', () => { store.device.layout = 'compact'; saveStore(); updateControls(); renderBoard(); });
$('editHeaderBtn').addEventListener('click', openHeaderModal);
$('addGameBtn').addEventListener('click', () => openGameModal(null));
$('dataBtn').addEventListener('click', openDataModal);
$('closeSeasonBtn').addEventListener('click', openCloseSeasonModal);
$('settingsBtn').addEventListener('click', openSettingsModal);

/* ═══════════════════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════════════════ */
loadStore();
applyTheme();
setMode(sessionStorage.getItem('bh_manage') === '1' ? 'manage' : 'user');
setView('board');
</script>
</body>
</html>
